services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cinema}
      MYSQL_USER: ${MYSQL_USER:-cinema}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cinema}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cinema}
      MYSQL_USER: ${MYSQL_USER:-cinema}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cinema}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
